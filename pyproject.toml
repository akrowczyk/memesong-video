[project]
name = "memesong-video"
version = "0.1.0"
description = "Local web app to align lyrics with an MP3 and render karaoke lyric videos for X"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pillow>=11.0.0",
    "numpy>=1.26.0,<2.3.0",
    "torch>=2.6.0,<2.9.0",
    "torchaudio>=2.6.0,<2.9.0",
    "stable-ts>=2.17.0",
    "demucs>=4.0.1",
    "soundfile>=0.12.1",
]

[tool.uv]
package = false
